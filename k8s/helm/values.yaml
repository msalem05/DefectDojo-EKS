# ==========================================
# DefectDojo Container Image
# ==========================================

# Shared image used by uWSGI, Celery Worker,
# Celery Beat and the initialiser Job.

image:
  repository: 622703418024.dkr.ecr.eu-west-2.amazonaws.com/defectdojo-eks-repo
  tag: "v1"
  pullPolicy: IfNotPresent


# ==========================================
# uWSGI - Web Application
# ==========================================

uwsgi:
  replicaCount: 2

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "1Gi"


# ==========================================
# Celery Worker - Background Processing
# ==========================================

celeryWorker:
  replicaCount: 2

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "1Gi"


# ==========================================
# Celery Beat - Periodic Task Scheduler
# ==========================================

celeryBeat:
  replicaCount: 1

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      memory: "256Mi"


# ==========================================
# Initialiser Job
# ==========================================

initializer:
  backoffLimit: 3

  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      memory: "1Gi"


# ==========================================
# Kubernetes Service
# ==========================================

service:
  name: uwsgi-svc
  type: ClusterIP
  port: 8081
  targetPort: 8081


# ==========================================
# ConfigMap
# ==========================================

configMap:
  name: defectdojo-config


# ==========================================
# External Secrets
# ==========================================

# These are Kubernetes Secret references.
# Actual credentials remain in AWS Secrets Manager.

secrets:
  existingSecret: defectdojo-secrets