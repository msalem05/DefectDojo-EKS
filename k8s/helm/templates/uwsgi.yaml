apiVersion: apps/v1
kind: Deployment
metadata:
  name: uwsgi-deployment
  labels:
    app: uwsgi

spec:
  replicas: {{ .Values.uwsgi.replicaCount }}

  selector:
    matchLabels:
      app: uwsgi

  template:
    metadata:
      labels:
        app: uwsgi

    spec:
      containers:
        - name: uwsgi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}

            - secretRef:
                name: defectdojo-valkey

          env:
            - name: DD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials-secret
                  key: db_url

            - name: DD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-secret-key-secret
                  key: dd_secret_key

            - name: DD_AES_256_KEY
              valueFrom:
                secretKeyRef:
                  name: aes-256-key-secret
                  key: aes_256_key

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          resources:
            {{- toYaml .Values.uwsgi.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: uwsgi

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}