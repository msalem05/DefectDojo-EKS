apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker-deployment
  labels:
    app: celery-worker

spec:
  replicas: {{ .Values.celeryWorker.replicaCount }}

  selector:
    matchLabels:
      app: celery-worker

  template:
    metadata:
      labels:
        app: celery-worker

    spec:
      containers:
        - name: celery-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["/entrypoint-celery-worker.sh"]

          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}

            - secretRef:
                name: defectdojo-valkey

          env:
            - name: DD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials-secret
                  key: db_url

            - name: DD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-secret-key-secret
                  key: dd_secret_key

            - name: DD_AES_256_KEY
              valueFrom:
                secretKeyRef:
                  name: aes-256-key-secret
                  key: aes_256_key

          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}