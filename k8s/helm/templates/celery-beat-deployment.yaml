apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat-deployment
  labels:
    app: celery-beat
spec:
  replicas: {{ .Values.celeryBeat.replicaCount }}

  # NEW: Prevent overlapping Celery Beat instances during updates
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["/entrypoint-celery-beat.sh"]

          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}

            - secretRef:
                name: {{ .Values.secrets.existingSecret }}

            # NEW: Inject Valkey connection URLs generated by ESO
            - secretRef:
                name: defectdojo-valkey

          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}