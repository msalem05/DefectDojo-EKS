apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat-deployment
  labels:
    app: celery-beat

spec:
  replicas: {{ .Values.celeryBeat.replicaCount }}

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: celery-beat

  template:
    metadata:
      labels:
        app: celery-beat

    spec:
      containers:
        - name: celery-beat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command: ["/entrypoint-celery-beat.sh"]

          envFrom:
            - configMapRef:
                name: {{ .Values.configMap.name }}

            - secretRef:
                name: defectdojo-valkey

          env:
            - name: DD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials-secret
                  key: db_url

            - name: DD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dd-secret-key-secret
                  key: dd_secret_key

            - name: DD_AES_256_KEY
              valueFrom:
                secretKeyRef:
                  name: aes-256-key-secret
                  key: aes_256_key

          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}