apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-proxy-config
    namespace: envoy-gateway-system

---

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: defectdojo
spec:
  gatewayClassName: envoy

  listeners:
    - name: https
      hostname: ddojo-sec.com
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: defectdojo-tls
      allowedRoutes:
        namespaces:
          from: Same

    - name: http
      hostname: ddojo-sec.com
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uwsgi-http-route
  namespace: defectdojo
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: http

  hostnames:
    - ddojo-sec.com

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: uwsgi-https-route
  namespace: defectdojo
spec:
  parentRefs:
    - name: envoy-gateway
      sectionName: https

  hostnames:
    - ddojo-sec.com

  rules:
    - backendRefs:
        - name: uwsgi-svc
          port: 8081