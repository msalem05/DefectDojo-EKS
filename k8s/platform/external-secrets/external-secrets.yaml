apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/eso-secrets-role  ## filler for now till i make the iam role, change when you make iam

---

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: default
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        jwt:
          serviceAccountRef:
            name: eso-service-account    

---

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: defectdojo-database-url
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-credentials-secret
    creationPolicy: Owner
  data:
    - secretKey: db_url
      remoteRef:
        key: defectdojo/database-url

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: defectdojo-secret-key
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: dd-secret-key-secret
    creationPolicy: Owner
  data:
    - secretKey: dd_secret_key
      remoteRef:
        key: defectdojo/dd-secret-key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: defectdojo-aes-key
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: aes-256-key-secret
    creationPolicy: Owner
  data:
    - secretKey: aes_256_key
      remoteRef:
        key: defectdojo/aes-256-key

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: defectdojo-admin-password
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: admin-password-secret
    creationPolicy: Owner
  data:
    - secretKey: admin_pw
      remoteRef:
        key: defectdojo/admin-password

---

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-parameter-store
  namespace: defectdojo
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-west-2

---

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: defectdojo-valkey
  namespace: defectdojo
spec:
  refreshInterval: 1m

  secretStoreRef:
    name: aws-parameter-store
    kind: SecretStore

  target:
    name: defectdojo-valkey
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DD_CELERY_BROKER_URL: "rediss://{{ .endpoint }}:6379/0?ssl_cert_reqs=required"
        DD_CACHE_URL: "rediss://{{ .endpoint }}:6379/1"

  data:
    - secretKey: endpoint
      remoteRef:
        key: /defectdojo/valkey/endpoint

