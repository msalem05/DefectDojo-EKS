apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: defectdojo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/msalem05/DefectDojo-EKS.git
    targetRevision: main
    path: k8s/helm
    helm:
      releaseName: defectdojo

  destination:
    server: https://kubernetes.default.svc
    namespace: defectdojo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true