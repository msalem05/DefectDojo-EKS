services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - postgres_data:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9.1.1-alpine
    volumes:
      - valkey_data:/data

  initializer:
    image: second_image
    depends_on:
      postgres:
        condition: service_started
    entrypoint:
      - /wait-for-it.sh
      - postgres:5432
      - -t
      - "30"
      - --
      - /entrypoint-initializer.sh
    environment:
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo

      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: User
      DD_INITIALIZE: "true"

      DD_SECRET_KEY: "local-development-secret"
      DD_CREDENTIAL_AES_256_KEY: "local-development-credential-key"

  uwsgi:
    image: second_image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started

    entrypoint:
      - /wait-for-it.sh
      - postgres:5432
      - -t
      - "30"
      - --
      - /entrypoint-uwsgi.sh

    environment:
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"

      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_CACHE_URL: redis://valkey:6379/1

      DD_SECRET_KEY: "local-development-secret"
      DD_CREDENTIAL_AES_256_KEY: "local-development-credential-key"

      DD_DATABASE_READINESS_TIMEOUT: "30"

      DD_UWSGI_MODE: "socket"
      DD_UWSGI_ENDPOINT: "0.0.0.0:3031"
      DD_UWSGI_NUM_OF_PROCESSES: "2"
      DD_UWSGI_NUM_OF_THREADS: "2"

    ports:
      - "8081:8081"

    volumes:
      - media:/app/media

  celeryworker:
    image: second_image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started

    entrypoint:
      - /wait-for-it.sh
      - postgres:5432
      - -t
      - "30"
      - --
      - /entrypoint-celery-worker.sh

    environment:
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_CACHE_URL: redis://valkey:6379/1

      DD_SECRET_KEY: "local-development-secret"
      DD_CREDENTIAL_AES_256_KEY: "local-development-credential-key"

      DD_DATABASE_READINESS_TIMEOUT: "30"

      DD_CELERY_LOG_LEVEL: "INFO"
      DD_CELERY_WORKER_POOL_TYPE: "solo"

  celerybeat:
    image: second_image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started

    entrypoint:
      - /wait-for-it.sh
      - postgres:5432
      - -t
      - "30"
      - --
      - /entrypoint-celery-beat.sh

    environment:
      DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
      DD_CELERY_BROKER_URL: redis://valkey:6379/0
      DD_CACHE_URL: redis://valkey:6379/1

      DD_SECRET_KEY: "local-development-secret"
      DD_CREDENTIAL_AES_256_KEY: "local-development-credential-key"

      DD_DATABASE_READINESS_TIMEOUT: "30"

volumes:
  postgres_data:
  valkey_data:
  media: